<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字人 · Mind</title>
<style>
  :root { --lav: #9D7BD8; --lav-deep: #7C5FB0; --ink: #4a3f5c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #f3edfa 0%, #e8ddf5 45%, #dccbef 100%);
    color: var(--ink);
  }
  #stage { position: fixed; inset: 0; }
  #live2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fallback {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%);
    font-size: 15px; color: #a08cc0; display: none;
  }
  #brand {
    position: fixed; top: 22px; left: 26px; display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: 1px; color: var(--lav-deep);
  }
  #brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lav);
    box-shadow: 0 0 0 4px rgba(157,123,216,.18); }
  #status { font-size: 12px; font-weight: 400; color: #a08cc0; margin-left: 4px; }

  #subtitle {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%);
    max-width: min(680px, 86vw); text-align: center;
    font-size: 16px; line-height: 1.7; color: var(--ink);
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(157,123,216,.25); border-radius: 16px;
    padding: 12px 22px; min-height: 0; display: none;
    box-shadow: 0 8px 28px rgba(124,95,176,.14);
  }
  #subtitle.on { display: block; }

  #chats { position: fixed; left: 26px; bottom: 96px; width: min(360px, 40vw);
    max-height: 42vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    scrollbar-width: none; }
  #chats::-webkit-scrollbar { display: none; }
  .msg { font-size: 13px; line-height: 1.6; padding: 8px 13px; border-radius: 12px;
    max-width: 88%; opacity: 0; transform: translateY(8px); transition: all .3s ease; }
  .msg.in { opacity: 1; transform: none; }
  .msg.me { align-self: flex-end; background: var(--lav); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: rgba(255,255,255,.9);
    border: 1px solid rgba(157,123,216,.2); border-bottom-left-radius: 4px; }

  #bar {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(640px, 92vw); display: flex; gap: 10px;
    background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(157,123,216,.3); border-radius: 999px;
    padding: 8px 8px 8px 22px; box-shadow: 0 10px 32px rgba(124,95,176,.18);
  }
  #msgInput { flex: 1; border: none; outline: none; background: none;
    font-size: 15px; color: var(--ink); }
  #msgInput::placeholder { color: #b9a9d6; }
  #sendBtn {
    border: none; border-radius: 999px; padding: 10px 24px; cursor: pointer;
    background: linear-gradient(135deg, var(--lav), var(--lav-deep)); color: #fff;
    font-size: 14px; letter-spacing: 2px; transition: transform .15s, box-shadow .15s;
  }
  #sendBtn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,95,176,.35); }
  #sendBtn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }

  #tips { position: fixed; right: 22px; top: 22px; display: flex; flex-direction: column;
    gap: 8px; align-items: flex-end; }
  .tip { font-size: 12px; color: #8f7ab3; background: rgba(255,255,255,.75);
    border: 1px solid rgba(157,123,216,.22); border-radius: 999px; padding: 6px 14px;
    cursor: pointer; transition: all .2s; user-select: none; }
  .tip:hover { background: var(--lav); color: #fff; border-color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="live2d"></canvas>
  <div id="fallback">形象加载中…</div>
</div>

<div id="brand"><span class="dot"></span>MIND 数字人<span id="status">加载中</span></div>

<div id="tips">
  <span class="tip" data-emo="开心">😊 开心</span>
  <span class="tip" data-emo="温柔">🌸 温柔</span>
  <span class="tip" data-emo="难过">🥺 难过</span>
  <span class="tip" data-emo="惊讶">😲 惊讶</span>
</div>

<div id="chats"></div>
<div id="subtitle"></div>

<div id="bar">
  <input id="msgInput" placeholder="和她说点什么…" autocomplete="off">
  <button id="sendBtn">发送</button>
</div>

<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi-live2d-cubism4.min.js"></script>
<script>
(function () {
  'use strict';
  // ══════════ 配置 ══════════
  // 本地开发：页面由 8090 托管，API 在 8084；云端部署（deploy/cloud）同源直连
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8084' : '';
  var MODEL_URL = '/models/haru/haru_greeter_t03.model3.json';

  var statusEl = document.getElementById('status');
  var subEl = document.getElementById('subtitle');
  var chatsEl = document.getElementById('chats');
  var input = document.getElementById('msgInput');
  var sendBtn = document.getElementById('sendBtn');
  var fallback = document.getElementById('fallback');

  function status(t) { statusEl.textContent = t ? '· ' + t : ''; }

  // ══════════ 渲染：复用主站已验证的 haru 头肩特写取景 ══════════
  // haru 全幅 2400×4500 带大量透明边距；实测头顶 y=251、头高 666
  var FRAME = { w: 2400, h: 4500, headTop: 251, headH: 666 };
  var app = null, model = null, base = { w: 0, h: 0 };
  var look = { x: 0, y: 0, tx: 0, ty: 0 };     // 视线/头跟随鼠标
  var audioCtx = null, analyser = null, mouthData = null;
  var EXP = { '开心': 'f04', '惊讶': 'f05', '难过': 'f02', '担心': 'f03',
              '温柔': 'f06', '平静': 'f00', '认真': 'f07' };

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('live2d');

  function fit() {
    if (!app) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 2 || h < 2) return;
    app.renderer.resize(w, h);
    if (model && base.w && base.h) {
      var s, y;
      if (Math.abs(base.w - FRAME.w) < 400 && Math.abs(base.h - FRAME.h) < 800) {
        s = (h * 0.52) / FRAME.headH;
        y = h * 0.05 - FRAME.headTop * s;
      } else {
        s = Math.min((w * 0.95) / base.w, (h * 2.4) / base.h);
        y = h * 0.02;
      }
      model.scale.set(s);
      model.anchor.set(0.5, 0);
      model.position.set(w / 2, y);
      fallback.style.display = 'none';
    }
  }

  function ensureCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  document.addEventListener('pointerdown', function once() {
    ensureCtx(); document.removeEventListener('pointerdown', once);
  });

  if (window.PIXI && PIXI.live2d) {
    app = new PIXI.Application({
      view: canvas, backgroundAlpha: 0, antialias: true,
      autoDensity: true, resolution: Math.min(window.devicePixelRatio || 1, 2)
    });
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

    PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract: false })
      .then(function (m) {
        model = m;
        app.stage.addChild(m);
        base.w = m.width; base.h = m.height;
        fit();
        status('在线');
      })
      .catch(function (e) { console.error(e); status('模型加载失败'); });

    document.addEventListener('pointermove', function (ev) {
      look.tx = (ev.clientX / window.innerWidth) * 2 - 1;    // -1 ~ 1
      look.ty = (ev.clientY / window.innerHeight) * 2 - 1;
    });

    app.ticker.add(function () {
      look.x += (look.tx - look.x) * 0.07;
      look.y += (look.ty - look.y) * 0.07;
      var mouth = 0;
      var energy = 0;
      if (analyser && mouthData) {
        analyser.getByteFrequencyData(mouthData);
        var sum = 0;
        for (var i = 0; i < mouthData.length; i++) sum += mouthData[i];
        energy = Math.min(1, (sum / mouthData.length) / 90);
      }
      // viseme 时间轴优先：当前音节的嘴形+开度，能量做自然感叠加
      var targetForm = 0.3;
      var mouthD = 0;
      if (vis && audioCtx) {
        var t = audioCtx.currentTime - vis.start;
        var ws = vis.words, hit = null;
        while (vis.i < ws.length && ws[vis.i].t + ws[vis.i].d < t) vis.i++;
        if (vis.i < ws.length && ws[vis.i].t <= t) hit = ws[vis.i];
        if (hit) {
          targetForm = hit.form;
          mouth = Math.max(energy * 1.25, hit.open * 0.35);
          // 协同发音：音节尾段提前 70ms 向下一音的嘴形过渡（真人"提前圆唇/咧嘴"现象）
          var edge = hit.t + hit.d - 0.07;
          if (vis.i + 1 < ws.length && t > edge) {
            var k = Math.min(1, (t - edge) / 0.07) * 0.6;
            targetForm = hit.form * (1 - k) + ws[vis.i + 1].form * k;
            mouthD = ws[vis.i + 1].open * 0.35 * k;
            mouth = Math.max(mouth * (1 - k), mouthD * 0.5);  // 当前音节收，下一音预热
          }
        }
      } else {
        mouth = energy;
      }
      // 帧率无关平滑：高收敛率，口型紧贴时间轴（τ≈8ms，仅滤单帧抖动）
      var kSm = 1 - Math.exp(-app.ticker.deltaMS * 0.12);
      curForm += (targetForm - curForm) * kSm;
      if (model) {
        try {
          var core = model.internalModel.coreModel;
          core.setParameterValueById('ParamAngleX', look.x * 18);
          core.setParameterValueById('ParamAngleY', -look.y * 10);
          core.setParameterValueById('ParamAngleZ', look.x * 8);
          core.setParameterValueById('ParamEyeBallX', look.x);
          core.setParameterValueById('ParamEyeBallY', -look.y);
          core.setParameterValueById('ParamBodyAngleX', look.x * 6);
          core.setParameterValueById('ParamMouthOpenY', mouth);
          core.setParameterValueById('ParamMouthForm', curForm);
        } catch (e) {}
      }
    }, PIXI.UPDATE_PRIORITY.LOW);
  } else {
    status('渲染库缺失');
  }

  function emotion(e) {
    try { if (model && EXP[e]) model.expression(EXP[e]); } catch (err) {}
  }
  document.querySelectorAll('.tip').forEach(function (el) {
    el.addEventListener('click', function () {
      emotion(el.dataset.emo);
      speak('你看，我现在是' + el.dataset.emo + '的样子。');
    });
  });

  // ══════════ TTS + 口型：viseme 时间轴 + 能量混合，预取队列逐句无缝播放 ══════════
  var ttsQueue = [], ttsPrefetch = [], ttsPlaying = false;
  var PREFETCH_DEPTH = 3;
  var vis = null;              // 当前播放的视位时间轴 {words, start}
  var curForm = 0.3;           // 平滑后的嘴形（-1 圆唇 ~ +1 扁唇）

  function trimSilence(buf) {
    try {
      var ch = buf.getChannelData(0);
      var thr = 0.01, start = 0, end = ch.length - 1;
      while (start < ch.length && Math.abs(ch[start]) < thr) start++;
      while (end > start && Math.abs(ch[end]) < thr) end--;
      var len = end - start + 1;
      if (len < buf.sampleRate * 0.1 || len >= ch.length - 64)
        return { buf: buf, startSec: 0 };
      var out = ensureCtx().createBuffer(buf.numberOfChannels, len, buf.sampleRate);
      for (var c = 0; c < buf.numberOfChannels; c++)
        out.copyToChannel(buf.getChannelData(c).subarray(start, end + 1), c);
      return { buf: out, startSec: start / buf.sampleRate };
    } catch (e) { return { buf: buf, startSec: 0 }; }
  }

  function loadAudio(text) {
    var ctx = ensureCtx();
    if (!ctx) return Promise.reject(new Error('no ctx'));
    return fetch(API + '/ai/tts?meta=1&text=' + encodeURIComponent(text))
      .then(function (r) { if (!r.ok) throw new Error('tts'); return r.json(); })
      .then(function (data) {
        var b64 = atob(data.audio);
        var ab = new Uint8Array(b64.length);
        for (var i = 0; i < b64.length; i++) ab[i] = b64.charCodeAt(i);
        return ctx.decodeAudioData(ab.buffer).then(function (raw) {
          var tr = trimSilence(raw);
          var words = (data.words || [])
            .map(function (w) {   // 裁掉的头部静音要同步平移时间轴
              return { t: w.t - tr.startSec, d: w.d, form: w.form, open: w.open };
            })
            .filter(function (w) { return w.t + w.d > 0 && w.t < tr.buf.duration; });
          return { buffer: tr.buf, words: words };
        });
      });
  }

  function ensurePrefetch() {
    while (ttsPrefetch.length < PREFETCH_DEPTH && ttsPrefetch.length < ttsQueue.length) {
      var t = ttsQueue[ttsPrefetch.length];
      ttsPrefetch.push({ text: t, promise: loadAudio(t) });
    }
  }

  function pump() {
    if (ttsPlaying) return;
    if (!ttsQueue.length) { ttsPrefetch = []; return; }
    ensurePrefetch();
    ttsPlaying = true;
    var text = ttsQueue.shift();
    var hit = ttsPrefetch.shift();
    var p = (hit && hit.text === text) ? hit.promise : loadAudio(text);
    p.then(function (au) {
      var ctx = ensureCtx();
      var src = ctx.createBufferSource();
      src.buffer = au.buffer;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      mouthData = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      analyser.connect(ctx.destination);
      subEl.textContent = text;
      subEl.classList.add('on');
      vis = { words: au.words, start: ctx.currentTime, i: 0 };
      src.onended = function () {
        analyser = null; vis = null; ttsPlaying = false;
        if (!ttsQueue.length) subEl.classList.remove('on');
        pump();
      };
      src.start();
      ensurePrefetch();
    }).catch(function () { ttsPlaying = false; pump(); });
  }

  function speak(text) {
    if (!text) return;
    ensureCtx();
    ttsQueue.push(String(text).replace(/\s+/g, ' ').trim());
    pump();
  }

  // ══════════ 对话：直连 ai-service SSE，逐句驱动语音+表情 ══════════
  var history = [];

  function addMsg(text, mine) {
    var d = document.createElement('div');
    d.className = 'msg ' + (mine ? 'me' : 'ai');
    d.textContent = text;
    chatsEl.appendChild(d);
    requestAnimationFrame(function () { d.classList.add('in'); });
    while (chatsEl.children.length > 8) chatsEl.removeChild(chatsEl.firstChild);
    chatsEl.scrollTop = chatsEl.scrollHeight;
  }

  function typeText(t) {
    subEl.textContent = t;
    subEl.classList.add('on');
  }

  function chat(text) {
    addMsg(text, true);
    sendBtn.disabled = true;
    status('思考中');
    fetch(API + '/ai/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history })
    }).then(function (r) {
      if (!r.ok || !r.body) throw new Error('http ' + r.status);
      var reader = r.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      function step() {
        return reader.read().then(function (res) {
          if (res.done) { finish(); return; }
          buf += dec.decode(res.value, { stream: true });
          var parts = buf.split('\n\n');
          buf = parts.pop();
          parts.forEach(function (line) {
            if (line.indexOf('data:') !== 0) return;
            try { handle(JSON.parse(line.slice(5).trim())); } catch (e) {}
          });
          return step();
        });
      }
      return step();
    }).catch(function (e) {
      console.error(e);
      speak('我这边网络出了点小状况，等一下再和我说说话好吗？');
      finish();
    });
  }

  function handle(ev) {
    if (ev.type === 'meta') {
      status(ev.mode === 'kb' ? '查阅资料' : '倾听中');
    } else if (ev.type === 'emotion') {
      emotion(ev.emotion);
    } else if (ev.type === 'sentence') {
      typeText(ev.text);
      addMsg(ev.text, false);
      speak(ev.text);
    } else if (ev.type === 'done') {
      status('在线');
    }
  }

  function finish() {
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', doSend);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doSend();
  });
  function doSend() {
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    history.push({ role: 'user', content: v });
    chat(v);
  }

  // 记录 AI 回复到历史（在 handle 里 sentence 时累积）
  var _handle = handle;
  var aiBuf = '';
  handle = function (ev) {
    _handle(ev);
    if (ev.type === 'sentence') aiBuf += ev.text;
    if (ev.type === 'done') {
      if (aiBuf) { history.push({ role: 'ai', content: aiBuf }); aiBuf = ''; }
      if (history.length > 20) history = history.slice(-20);
    }
  };

  // 开场白（首次交互后才可出声，文字先上屏）
  addMsg('你好呀，我是 Mind。今天感觉怎么样？', false);
  window.addEventListener('pointerdown', function once() {
    speak('你好呀，我是 Mind。今天感觉怎么样？');
    window.removeEventListener('pointerdown', once);
  }, { once: true });
})();
</script>
</body>
</html>
