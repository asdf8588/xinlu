<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mind 壁纸</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: linear-gradient(160deg, #f3edfa 0%, #e8ddf5 45%, #dccbef 100%); }
  #stage { position: fixed; inset: 0; }
  #live2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 问候气泡：低打扰，出现在角色头部旁 */
  #bubble {
    position: fixed; top: 22%; right: 26%; max-width: 300px;
    background: rgba(255,255,255,.88); border: 1px solid rgba(157,123,216,.3);
    border-radius: 16px 16px 4px 16px; padding: 12px 18px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.7; color: #4a3f5c;
    box-shadow: 0 8px 28px rgba(124,95,176,.16);
    opacity: 0; transform: translateY(10px); transition: all .6s ease;
    pointer-events: none;
  }
  #bubble.on { opacity: 1; transform: none; }
  #clock {
    position: fixed; top: 26px; right: 40px; text-align: right;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; pointer-events: none;
  }
  #clock .t { font-size: 44px; font-weight: 300; color: #7c5fb0; letter-spacing: 2px; }
  #clock .d { font-size: 13px; color: #a08cc0; margin-top: 2px; }
</style>
</head>
<body>
<div id="stage"><canvas id="live2d"></canvas></div>
<div id="bubble"></div>
<div id="clock"><div class="t" id="ct"></div><div class="d" id="cd"></div></div>

<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/live2dcubismcore.min.js"></script>
<script src="/vendor/pixi-live2d-cubism4.min.js"></script>
<script>
(function () {
  'use strict';
  var FRAME = { w: 2400, h: 4500, headTop: 251, headH: 666 };  // haru 头肩特写实测值
  var app = null, model = null, base = { w: 0, h: 0 };
  var look = { x: 0, y: 0, tx: 0, ty: 0 };
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('live2d');

  function fit() {
    if (!app) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 2 || h < 2) return;
    app.renderer.resize(w, h);
    if (model && base.w && base.h) {
      var s = (h * 0.62) / FRAME.headH;          // 壁纸版取景更大：头占 62%
      var y = h * 0.03 - FRAME.headTop * s;
      model.scale.set(s);
      model.anchor.set(0.5, 0);
      model.position.set(w * 0.72, y);           // 偏右站立，左侧留给桌面图标
      var core = model.internalModel.coreModel;
      try { core.setParameterValueById('ParamMouthOpenY', 0); } catch (e) {}
    }
  }

  if (window.PIXI && PIXI.live2d) {
    app = new PIXI.Application({
      view: canvas, backgroundAlpha: 0, antialias: true,
      autoDensity: true, resolution: Math.min(window.devicePixelRatio || 1, 1.5)
    });
    window.addEventListener('resize', fit);

    PIXI.live2d.Live2DModel.from('/models/haru/haru_greeter_t03.model3.json',
      { autoInteract: false }).then(function (m) {
      model = m;
      app.stage.addChild(m);
      base.w = m.width; base.h = m.height;
      fit();
    }).catch(function () {});

    // 视线跟随：浏览器/交互模式下跟真实鼠标；Lively 普通模式下自然待机
    document.addEventListener('pointermove', function (ev) {
      look.tx = (ev.clientX / window.innerWidth) * 2 - 1;
      look.ty = (ev.clientY / window.innerHeight) * 2 - 1;
    });

    app.ticker.add(function () {
      look.x += (look.tx - look.x) * 0.05;
      look.y += (look.ty - look.y) * 0.05;
      if (model) {
        try {
          var core = model.internalModel.coreModel;
          core.setParameterValueById('ParamAngleX', look.x * 16);
          core.setParameterValueById('ParamAngleY', -look.y * 9);
          core.setParameterValueById('ParamAngleZ', look.x * 7);
          core.setParameterValueById('ParamEyeBallX', look.x);
          core.setParameterValueById('ParamEyeBallY', -look.y);
          core.setParameterValueById('ParamBodyAngleX', look.x * 5);
        } catch (e) {}
      }
    }, PIXI.UPDATE_PRIORITY.LOW);
  }

  // ══════════ 时钟 + 低打扰关怀气泡（纯视觉，无音频依赖） ══════════
  var LINES = [
    '坐久了吧？起来伸个懒腰吧～',
    '记得多喝水哦。',
    '窗外看看远处，眼睛休息一下。',
    '深呼吸三次，肩膀放松。',
    '今天也辛苦啦。',
    '累了就趴一会儿，没关系的。',
  ];
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  var bubble = document.getElementById('bubble');
  var hideTimer = null;

  function tickClock() {
    var n = new Date();
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    document.getElementById('ct').textContent = p(n.getHours()) + ':' + p(n.getMinutes());
    document.getElementById('cd').textContent =
      (n.getMonth() + 1) + '月' + n.getDate() + '日 · 周' + WEEK[n.getDay()];
  }
  tickClock();
  setInterval(tickClock, 15000);

  function say() {
    bubble.textContent = LINES[Math.floor(Math.random() * LINES.length)];
    bubble.classList.add('on');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { bubble.classList.remove('on'); }, 12000);
  }
  setTimeout(say, 8000);
  setInterval(say, 12 * 60 * 1000);   // 每 12 分钟一句关怀，低打扰
})();
</script>
</body>
</html>
